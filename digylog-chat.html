<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Digylog Chat</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#eef3f8}button,input,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.top{display:flex;align-items:center;gap:13px;padding:13px 17px;border-bottom:1px solid #dbe4ee;background:linear-gradient(135deg,#0f172a,#172554 66%,#164e63);color:#fff;box-shadow:0 8px 24px rgba(15,23,42,.16);z-index:3}.logo{display:grid;width:43px;height:43px;place-items:center;border:1px solid rgba(255,255,255,.16);border-radius:13px;background:rgba(255,255,255,.1);font-size:21px}.heading{min-width:0}.heading h1{margin:0;font-size:17px;font-weight:900}.heading p{margin:3px 0 0;color:#cbd5e1;font-size:10px;font-weight:650}.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}.pill,.refresh{border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.09);color:#e2e8f0;padding:8px 11px;font-size:10px;font-weight:800}.refresh{cursor:pointer}.refresh:hover{background:rgba(255,255,255,.17)}.main{min-height:0;display:grid;grid-template-columns:minmax(290px,360px) 1fr;gap:1px;background:#dbe4ee}.side,.chat{min-height:0;background:#fff}.side{display:grid;grid-template-rows:auto auto 1fr}.filters{padding:12px;border-bottom:1px solid #e7edf4;background:#fff}.search{display:flex;align-items:center;gap:8px;border:1px solid #dbe4ee;border-radius:11px;background:#f8fafc;padding:0 10px}.search:focus-within{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.1)}.search input{width:100%;border:0;outline:0;background:transparent;padding:10px 0;color:#24324a;font-size:12px}.tabs{display:flex;gap:6px;margin-top:9px}.tabs button{flex:1;border:1px solid #dbe4ee;border-radius:9px;background:#fff;padding:7px 5px;color:#64748b;font-size:10px;font-weight:850;cursor:pointer}.tabs button.on{border-color:#c7d2fe;background:#eef2ff;color:#4338ca}.summary{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid #edf1f5;color:#64748b;font-size:10px;font-weight:750}.conv-list{overflow:auto}.conv{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;border:0;border-bottom:1px solid #edf1f5;background:#fff;padding:12px;text-align:left;cursor:pointer}.conv:hover{background:#f8fafc}.conv.on{background:#eef2ff;box-shadow:inset 3px 0 #4f46e5}.avatar{display:grid;width:42px;height:42px;place-items:center;border-radius:13px;background:linear-gradient(135deg,#dbeafe,#e0e7ff);color:#3730a3;font-size:12px;font-weight:950}.conv-main{min-width:0}.conv-title{display:flex;align-items:center;gap:7px}.conv-title b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.dot{width:7px;height:7px;border-radius:999px;background:#22c55e;box-shadow:0 0 0 3px #dcfce7}.preview{margin-top:4px;overflow:hidden;color:#64748b;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.conv-meta{text-align:right}.time{display:block;color:#94a3b8;font-size:8px;white-space:nowrap}.badge{display:inline-grid;min-width:19px;height:19px;margin-top:5px;place-items:center;border-radius:999px;background:#ef4444;color:#fff;padding:0 5px;font-size:9px;font-weight:900}.closed{display:inline-block;margin-top:5px;border-radius:999px;background:#f1f5f9;color:#64748b;padding:3px 6px;font-size:8px;font-weight:850}.chat{display:grid;grid-template-rows:auto 1fr auto;position:relative}.chat-head{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid #e2e8f0;background:#fff}.chat-head h2{margin:0;font-size:14px;font-weight:900}.chat-head p{margin:3px 0 0;color:#64748b;font-size:10px}.back{display:none;border:0;background:#eef2ff;color:#4338ca;border-radius:9px;padding:7px 9px;font-weight:900}.messages{overflow:auto;padding:20px;background:radial-gradient(circle at 10% 0,#eef2ff 0,transparent 24%),linear-gradient(180deg,#f8fafc,#eef3f8)}.msg-row{display:flex;margin:8px 0}.msg-row.out{justify-content:flex-end}.msg{max-width:min(72%,680px);border:1px solid #dbe4ee;border-radius:15px 15px 15px 4px;background:#fff;padding:9px 12px;box-shadow:0 3px 10px rgba(15,23,42,.05)}.msg-row.out .msg{border-color:#4f46e5;border-radius:15px 15px 4px 15px;background:linear-gradient(135deg,#4f46e5,#4338ca);color:#fff}.msg-text{font-size:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.msg-time{display:block;margin-top:5px;color:#94a3b8;font-size:8px;text-align:right}.msg-row.out .msg-time{color:#c7d2fe}.composer{display:flex;gap:9px;align-items:flex-end;padding:12px 15px;border-top:1px solid #dbe4ee;background:#fff}.composer textarea{min-height:42px;max-height:120px;flex:1;resize:none;border:1px solid #dbe4ee;border-radius:12px;background:#f8fafc;padding:11px 13px;outline:0;font-size:12px;line-height:1.5}.composer textarea:focus{border-color:#6366f1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}.send{height:42px;border:0;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#4338ca);color:#fff;padding:0 18px;font-size:11px;font-weight:900;cursor:pointer;box-shadow:0 6px 14px rgba(79,70,229,.25)}.send:disabled{cursor:not-allowed;opacity:.5}.empty,.loading,.error{display:grid;height:100%;place-items:center;padding:30px;text-align:center;color:#64748b}.empty strong,.error strong{display:block;color:#334155;font-size:15px}.empty span,.error span{display:block;margin-top:6px;font-size:10px;line-height:1.7}.spinner{width:25px;height:25px;margin:auto;border:3px solid #dbe4ee;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.retry{margin-top:13px;border:0;border-radius:9px;background:#4338ca;color:#fff;padding:8px 13px;font-size:10px;font-weight:900;cursor:pointer}.toast{position:fixed;right:18px;bottom:18px;z-index:10;border-radius:11px;background:#0f172a;color:#fff;padding:10px 14px;font-size:10px;font-weight:800;box-shadow:0 10px 30px rgba(15,23,42,.24)}
@media(max-width:760px){.top{padding:10px 12px}.logo{width:38px;height:38px}.heading p,.pill{display:none}.main{display:block;position:relative}.side,.chat{position:absolute;inset:0}.chat{display:none}.app.chat-open .side{display:none}.app.chat-open .chat{display:grid}.back{display:block}.messages{padding:12px}.msg{max-width:88%}.composer{padding:9px}.send{padding:0 13px}.conv-list{padding-bottom:70px}}
body.compact{background:#fff}body.compact .app{display:block;height:100dvh}body.compact .top,body.compact .side{display:none!important}body.compact .main{display:block;height:100%;background:#fff}body.compact .chat{position:relative!important;inset:auto!important;display:grid!important;width:100%;height:100%;grid-template-rows:auto 1fr auto}body.compact .back{display:none!important}body.compact .chat-head{padding:10px 13px;background:linear-gradient(135deg,#f8fafc,#eef2ff)}body.compact .messages{padding:12px}body.compact .msg{max-width:85%}body.compact .composer{padding:9px}body.compact .empty,body.compact .loading,body.compact .error{min-height:220px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top"><div class="logo">💬</div><div class="heading"><h1>Digylog Chat</h1><p>Conversations réelles, sécurisées par les Tracking du CRM</p></div><div class="top-actions"><span class="pill" id="scope">Chargement…</span><button class="refresh" id="refresh">↻ Actualiser</button></div></header>
  <main class="main">
    <aside class="side"><div class="filters"><label class="search"><span>⌕</span><input id="search" placeholder="Rechercher un Tracking ou message…"></label><div class="tabs"><button class="on" data-tab="open">Ouvertes</button><button data-tab="new">Nouvelles</button><button data-tab="closed">Fermées</button><button data-tab="all">Toutes</button></div></div><div class="summary"><span id="count">0 conversation</span><span id="sync">—</span></div><div class="conv-list" id="list"><div class="loading"><div><div class="spinner"></div><span>Chargement des conversations…</span></div></div></div></aside>
    <section class="chat"><div class="chat-head" id="chatHead"><button class="back" id="back">←</button><div><h2>Conversation</h2><p>Sélectionnez une conversation</p></div></div><div class="messages" id="messages"><div class="empty"><div><strong>Digylog Chat</strong><span>Choisissez une conversation pour lire et répondre.</span></div></div></div><form class="composer" id="composer"><textarea id="message" maxlength="2000" placeholder="Écrire un message…" disabled></textarea><button class="send" id="send" disabled>Envoyer</button></form></section>
  </main>
</div>
<script>
(()=>{'use strict';
const API='api.php', TOKEN='8c907fc0f4ffe0b9775a6b7c3c0fc7700e5724c0d78343df';
const PARAMS=new URLSearchParams(location.search), FOCUS_TRACKING=String(PARAMS.get('tracking')||'').trim().toUpperCase(), COMPACT=PARAMS.get('compact')==='1';
if(COMPACT)document.body.classList.add('compact');
const $=id=>document.getElementById(id), state={all:[],tab:'open',q:'',active:null,messages:[],loading:false}, TRACKING_RE=/^[A-Z0-9_-]{3,80}$/;let searchTimer=0;
function viewerId(){return String(localStorage.getItem('paraveda_session_v1')||PARAMS.get('viewerId')||'').trim()}
function viewerIsAdmin(){try{const id=viewerId(),users=JSON.parse(localStorage.getItem('paraveda_users_v1')||'[]');return Array.isArray(users)&&users.some(u=>u&&!u._del&&String(u.id)===id&&u.role==='admin')}catch{return false}}
async function call(action,extra={}){const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','X-Sync-Token':TOKEN},body:JSON.stringify({action,viewerId:viewerId(),...extra})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.err||'request-failed');return j}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const track=c=>String(c.traking??c.tracking??'').trim().toUpperCase();
const cid=c=>String(c.id??c.chatId??c.chat_id??'');
const date=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?String(v).slice(0,16):d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
const preview=c=>String(c.lastMessage?.message??c.lastMessage?.text??c.lastMessage??c.message??'').trim();
function toast(t){const n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2800)}
function filtered(){return state.all.filter(c=>{const closed=!!c.closed,unread=Number(c.unread??c.notreaded??0)>0;if(state.tab==='open'&&closed)return false;if(state.tab==='closed'&&!closed)return false;if(state.tab==='new'&&!unread)return false;const q=state.q.toLowerCase();return !q||track(c).toLowerCase().includes(q)||preview(c).toLowerCase().includes(q)})}
function renderList(){const rows=filtered();$('count').textContent=rows.length+' conversation'+(rows.length===1?'':'s');if(!rows.length){$('list').innerHTML='<div class="empty"><div><strong>Aucune conversation</strong><span>Aucun Chat Digylog autorisé ne correspond à ce filtre.</span></div></div>';return}$('list').innerHTML=rows.map(c=>{const id=cid(c),unread=Number(c.unread??c.notreaded??0),on=state.active&&cid(state.active)===id;return `<button class="conv${on?' on':''}" data-id="${esc(id)}"><span class="avatar">${esc(track(c).slice(-3)||'CHAT')}</span><span class="conv-main"><span class="conv-title"><b>${esc(track(c)||'Sans Tracking')}</b>${c.isOnline?'<i class="dot"></i>':''}</span><span class="preview">${esc(preview(c)||'Nouvelle conversation')}</span></span><span class="conv-meta"><span class="time">${esc(date(c.updatedAt))}</span>${unread?`<span class="badge">${unread}</span>`:c.closed?'<span class="closed">Fermée</span>':''}</span></button>`}).join('');$('list').querySelectorAll('.conv').forEach(b=>b.onclick=()=>openConversation(b.dataset.id))}
function collectMessages(node,out=[]){if(!node||typeof node!=='object')return out;if(Array.isArray(node)){node.forEach(x=>collectMessages(x,out));return out}const text=node.message??node.text??node.content??node.body;if((text!==undefined&&typeof text!=='object')&&(node.id!==undefined||node.messageId!==undefined||node.createdAt||node.updatedAt))out.push(node);else Object.values(node).forEach(x=>collectMessages(x,out));return out}
function messageText(m){return String(m.message??m.text??m.content??m.body??'')}
function outgoing(m){const t=String(m.type??m.senderType??m.from??'').toLowerCase();return String(m.profil??'')==='2'||!!(m.isSeller||m.fromSeller||m.sellerMessage||['seller','agent','admin','out','outgoing'].includes(t))}
function renderMessages(){if(!state.active)return;const rows=state.messages;if(!rows.length){$('messages').innerHTML='<div class="empty"><div><strong>Aucun message</strong><span>La conversation est vide.</span></div></div>';return}$('messages').innerHTML=rows.map(m=>`<div class="msg-row${outgoing(m)?' out':''}"><div class="msg"><div class="msg-text">${esc(messageText(m))}</div><span class="msg-time">${esc(date(m.createdAt??m.updatedAt??m.date))}</span></div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}
async function openConversation(id,silent=false){const c=state.all.find(x=>cid(x)===String(id));if(!c)return;state.active=c;renderList();$('app').classList.add('chat-open');$('chatHead').innerHTML=`<button class="back" id="back">←</button><div><h2>${esc(track(c))}</h2><p>${c.closed?'Conversation fermée':'Conversation ouverte'} · Digylog</p></div>`;$('back').onclick=()=>$('app').classList.remove('chat-open');$('message').disabled=!!c.closed;$('send').disabled=!!c.closed;if(!silent)$('messages').innerHTML='<div class="loading"><div><div class="spinner"></div><span>Chargement des messages…</span></div></div>';try{const j=await call('digylog_chat_history',{tracking:track(c)});state.messages=collectMessages(j.payload||j.messages||[]).filter((m,i,a)=>{const k=String(m.id??m.messageId??i);return a.findIndex(x=>String(x.id??x.messageId??a.indexOf(x))===k)===i});state.messages.sort((a,b)=>new Date(a.createdAt??a.updatedAt??0)-new Date(b.createdAt??b.updatedAt??0));renderMessages()}catch(e){if(!silent)$('messages').innerHTML='<div class="error"><div><strong>Impossible de charger les messages</strong><span>'+esc(e.message)+'</span></div></div>'}}
function focusedError(err){
  const code=String(err?.message||err||'request-failed');
  const labels={
    'no-digylog-token':'خاص API Token الدائم ديال Digylog يتسجل من إعدادات الإدارة.',
    'chat-session-required':'Session ديال CRM ما وصلاتش للشات. سد المربع وعاود افتحو.',
    'chat-user-not-found':'المستخدم الحالي ما تلقاش فالسيرفر.',
    'chat-tracking-forbidden':'هاد Tracking ما تابعش للطلبيات المسموح بها لهذا الحساب.',
    'digylog-chat-http':'تعذر الاتصال بـDigylog API Seller V2.1.0.'
  };
  $('app').classList.add('chat-open');
  $('chatHead').innerHTML='<div><h2>'+esc(FOCUS_TRACKING||'Digylog Chat')+'</h2><p>Chat ديال هاد الطلبية</p></div>';
  $('messages').innerHTML='<div class="error"><div><strong>الشات ما قدرش يتصل</strong><span>'+esc(labels[code]||code)+'</span><button type="button" class="retry" id="focusRetry">عاود المحاولة</button></div></div>';
  $('message').disabled=true;$('send').disabled=true;
  $('focusRetry').onclick=()=>load(false);
}
async function loadFocused(silent=false){
  const j=await call('digylog_chat_direct',{tracking:FOCUS_TRACKING});
  const c=j.conversation&&typeof j.conversation==='object'?j.conversation:null;
  if(!c){state.active=null;$('app').classList.add('chat-open');$('chatHead').innerHTML='<div><h2>'+esc(FOCUS_TRACKING)+'</h2><p>Chat Digylog de cette commande</p></div>';$('messages').innerHTML='<div class="empty"><div><strong>ما كاين حتى Chat</strong><span>Digylog مازال ما أنشأش محادثة لهاد الطلبية.</span></div></div>';$('message').disabled=true;$('send').disabled=true;return}
  if(!c.traking&&!c.tracking)c.traking=FOCUS_TRACKING;
  state.all=[c];state.active=c;$('app').classList.add('chat-open');
  $('chatHead').innerHTML='<div><h2>'+esc(FOCUS_TRACKING)+'</h2><p>'+(c.closed?'Conversation fermée':'Conversation ouverte')+' · Digylog</p></div>';
  $('message').disabled=!!c.closed;$('send').disabled=!!c.closed;
  state.messages=collectMessages(j.payload||[]).filter((m,i,a)=>{const k=String(m.id??m.messageId??i);return a.findIndex(x=>String(x.id??x.messageId??a.indexOf(x))===k)===i});
  state.messages.sort((a,b)=>new Date(a.createdAt??a.updatedAt??0)-new Date(b.createdAt??b.updatedAt??0));renderMessages();
}
async function load(silent=false){
  if(state.loading)return;state.loading=true;if(!silent)$('sync').textContent='Chargement…';
  try{
    if(FOCUS_TRACKING){await loadFocused(silent);return}
    const requested=state.q.trim().toUpperCase();
    if(!requested){state.all=[];$('scope').textContent='Recherche par Tracking';$('sync').textContent='—';renderList();return}
    if(!TRACKING_RE.test(requested)){state.all=[];$('sync').textContent='Tracking invalide';renderList();return}
    const j=await call('digylog_chat_list',{tracking:requested});state.all=Array.isArray(j.conversations)?j.conversations:[];
    $('scope').textContent=j.viewer?.role==='admin'?'Admin · Tracking exact':(j.viewer?.agent||'Compte')+' · Tracking autorisé';
    $('sync').textContent='À jour · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});renderList();
    if(state.active){const same=state.all.find(c=>cid(c)===cid(state.active));if(same){state.active=same;await openConversation(cid(same),true)}else{state.active=null;$('app').classList.remove('chat-open')}}
  }catch(e){$('sync').textContent='Erreur';if(FOCUS_TRACKING)focusedError(e);else if(!silent)$('list').innerHTML='<div class="error"><div><strong>Connexion Digylog impossible</strong><span>'+esc(e.message)+'</span></div></div>'}
  finally{state.loading=false}
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));state.tab=b.dataset.tab;renderList()});$('search').oninput=e=>{state.q=e.target.value.trim().toUpperCase();clearTimeout(searchTimer);searchTimer=setTimeout(()=>load(false),350)};$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(searchTimer);load(false)}};$('refresh').onclick=()=>load();$('back').onclick=()=>$('app').classList.remove('chat-open');$('composer').onsubmit=async e=>{e.preventDefault();const text=$('message').value.trim();if(!text||!state.active)return;$('send').disabled=true;try{await call('digylog_chat_send',{tracking:track(state.active),chatId:cid(state.active),message:text});$('message').value='';toast('Message envoyé');await openConversation(cid(state.active),true);await load(true)}catch(err){toast('Échec: '+err.message)}finally{$('send').disabled=!!state.active?.closed}};$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}};
if(!viewerId()){if(FOCUS_TRACKING)focusedError('chat-session-required');else $('list').innerHTML='<div class="error"><div><strong>Session CRM introuvable</strong><span>Reconnectez-vous au CRM.</span></div></div>'}else{load();setInterval(()=>{if(!document.hidden)load(true)},5000)}
})();
</script>
</body>
</html>
